<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Very Ghood — Dinner with Chef Rose</title>
  <meta name="description" content="Very Ghood — Dinner with Chef Rose. Order from our everyday menu or book Chef Rose for your next catering event." />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://script.google.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.png" />
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">
        <img src="assets/logo.png" alt="Very Ghood" />
        <span class="nav__brand">Very Ghood</span>
      </a>
      <ul class="nav__links">
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="catering.html">Catering</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav__right">
        <a href="cart.html" class="cart-btn" id="nav-cart-btn">
          <span class="cart-text">Cart</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="cart-count" id="nav-cart-count"></span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- MOBILE NAV -->
  <div class="nav__mobile" id="mobile-nav">
    <a href="menu.html">Menu</a>
    <a href="gallery.html">Gallery</a>
    <a href="catering.html">Catering</a>
    <a href="contact.html">Contact</a>
      </div>

  <!-- HERO -->
  <main>
    <section class="hero">
      <img src="assets/logo.png" alt="Chef Rose Logo" class="hero__logo" />
      <h1 class="hero__concept">Dinner with Chef Rose</h1>
      <p class="hero__sub">Catering &amp; Everyday Menu</p>
      <div class="hero__divider"></div>
      <div class="hero__ctas">
        <a href="menu.html" class="btn btn-primary">Order Now</a>
        <a href="catering.html" class="btn btn-outline">Book Catering</a>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">&copy; <span id="year"></span> Very Ghood. All rights reserved.</p>
      <ul class="footer__links">
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="catering.html">Catering</a></li>
        <li><a href="contact.html">Contact</a></li>

        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms &amp; Conditions</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Hamburger
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobile-nav');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileNav.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', hamburger.classList.contains('open'));
    });
    mobileNav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileNav.classList.remove('open');
      });
    });
  </script>
</body>
</html>
