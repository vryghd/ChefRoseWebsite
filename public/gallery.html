<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Very Ghood</title>
  <meta name="description" content="Food photos from Very Ghood — Dinner with Chef Rose." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo.png" />
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">
        <img src="assets/logo.png" alt="Very Ghood" />
        <span class="nav__brand">Very Ghood</span>
      </a>
      <ul class="nav__links">
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="catering.html">Catering</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav__right">
        <a href="cart.html" class="cart-btn" id="nav-cart-btn">
          <span class="cart-text">Cart</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="cart-count" id="nav-cart-count"></span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="nav__mobile" id="mobile-nav">
    <a href="menu.html">Menu</a>
    <a href="gallery.html">Gallery</a>
    <a href="catering.html">Catering</a>
    <a href="contact.html">Contact</a>
      </div>

  <main>
    <header class="page-header">
      <p class="page-header__label">The Food</p>
      <h1 class="page-header__title">Gallery</h1>
    </header>

    <section class="gallery-section">
      <div class="container">
        <div class="gallery-grid" id="gallery-grid"></div>
        <div class="gallery-empty hidden" id="gallery-empty">
          <p>Photos coming soon.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer">
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox__prev" id="lightbox-prev" aria-label="Previous">&#8592;</button>
    <button class="lightbox__next" id="lightbox-next" aria-label="Next">&#8594;</button>
    <div class="lightbox__img-wrap">
      <img class="lightbox__img" id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">&copy; <span id="year"></span> Very Ghood. All rights reserved.</p>
      <ul class="footer__links">
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="catering.html">Catering</a></li>
        <li><a href="contact.html">Contact</a></li>

        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="terms.html">Terms &amp; Conditions</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/gallery.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobile-nav');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileNav.classList.toggle('open');
    });
    mobileNav.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileNav.classList.remove('open');
      });
    });
  </script>
</body>
</html>
